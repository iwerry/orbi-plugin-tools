[package]
name = "orbi-installer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Instalador do Orbi Plugin Tools — Draft Creative Studio Ltda"

[[bin]]
name = "Orbi-Plugin-Tools-Setup"
path = "src/main.rs"

[dependencies]
include_dir = "0.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-manifest = "1"
