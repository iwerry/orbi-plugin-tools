<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Orbi BeatMarker</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('orbi.theme')||'dark')}catch(e){}</script>
  <link rel="stylesheet" href="shared/css/orbi-ui.css">
</head>
<body data-ext="beatmarker" data-title="BeatMarker">

  <section class="card">
    <h2><i data-icon="music"></i>Música</h2>
    <p class="hint ppro-only">Selecione o clipe de música na timeline.</p>
    <p class="hint ae-only">Selecione a camada de música.</p>
    <div class="row"><label for="every">Marcar</label></div>
    <select id="every">
      <option value="1">Todos os beats</option>
      <option value="2">1 a cada 2 beats</option>
      <option value="4">Só tempos fortes (compasso 4/4)</option>
      <option value="8">1 a cada 2 compassos</option>
    </select>
    <div class="row">
      <label for="offset">Deslocar</label><output id="offset-v"></output>
      <input type="range" id="offset" min="-100" max="100" step="1" value="0">
    </div>
    <div class="row">
      <label for="bpm">BPM fixo (0 = automático)</label><output id="bpm-v"></output>
      <input type="range" id="bpm" min="0" max="200" step="1" value="0">
    </div>
    <div class="ae-only">
      <div class="row"><label for="target">Onde marcar</label></div>
      <select id="target"><option value="layer">Na camada</option><option value="comp">Na composição</option></select>
    </div>
  </section>

  <section class="card">
    <h2><i data-icon="sparkles"></i>Resultado</h2>
    <div class="stats">
      <div><b id="sBpm">–</b><span>BPM</span></div>
      <div><b id="sBeats">–</b><span>beats</span></div>
      <div><b id="sMarks">–</b><span>marcadores</span></div>
    </div>
    <div class="actions">
      <button data-action="mark" id="btnMark" class="primary wide"><i data-icon="music"></i>Detectar e marcar</button>
      <button data-action="clear" id="btnClear" class="wide"><i data-icon="eraser"></i>Limpar marcadores Orbi</button>
    </div>
    <div id="status" class="status"></div>
  </section>
  <script src="shared/js/orbi-bridge.js"></script>
  <script src="shared/js/orbi-icons.js"></script>
  <script src="shared/js/orbi-engine.js"></script>
  <script src="shared/js/orbi-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
